name: Publish

# Publishing happens on a version tag, and can be triggered by hand for the
# first release (the tag may predate this workflow).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --all-extras --group dev

      # Publishing something that does not pass its own tests is how a broken
      # release reaches people who cannot roll it back.
      - name: Test before publishing
        run: uv run pytest

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest

    # Trusted publishing: PyPI verifies this workflow's OIDC identity, so no
    # API token is stored anywhere. The environment name has to match the one
    # registered on PyPI.
    environment:
      name: pypi
      url: https://pypi.org/p/aimai-kit

    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
