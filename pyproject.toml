[project]
name = "aimai-kit"
version = "0.4.0"
description = "A framework-free LLM engineering toolkit: provider adapters, prompt and context engineering, structured outputs, tools, and a bounded agent loop"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "fport" }]
keywords = [
    "llm",
    "anthropic",
    "openai",
    "gemini",
    "prompt-engineering",
    "structured-outputs",
    "tool-calling",
    "agents",
    "context-engineering",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.9",
    "tiktoken>=0.14",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
providers = [
    "openai>=3.0",
    "anthropic>=1.0,<2",
    "google-genai>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[project.scripts]
model-probe = "aimai_kit.provider.cli.probe:main"
prompt-lab = "aimai_kit.prompts.cli:main"

[project.urls]
Homepage = "https://github.com/fport/aimai-kit"
Repository = "https://github.com/fport/aimai-kit"
Documentation = "https://github.com/fport/aimai-kit/tree/main/docs"
Issues = "https://github.com/fport/aimai-kit/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aimai_kit"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "prompts", "config", "docs", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not live'"
markers = [
    "live: calls a real provider API; excluded from the default run",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
